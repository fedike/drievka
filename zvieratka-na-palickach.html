<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zvieratká na paličkách</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:#edf2f8;color:#192751;
  font-family:'Trebuchet MS',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:52px;height:52px;flex:0 0 auto;object-fit:contain}
@media (max-width:760px){.logo{width:42px;height:42px}}
@media (max-height:700px){.logo{width:38px;height:38px}}
h1{font-size:clamp(19px,2.4vw,29px);font-weight:900;color:#192751;letter-spacing:.2px;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:#fff;border:1px solid rgba(25,39,81,.15);border-radius:999px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:#192751;padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button.active{background:#192751;color:#fff}
.seg button:focus-visible,.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid #7aa7e8;outline-offset:2px}
.btn{appearance:none;border:1px solid rgba(25,39,81,.18);background:#fff;color:#192751;font:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#f2f6fc}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(25,39,81,.18);background:#fff;color:#192751;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.iconbtn:hover{background:#f2f6fc}
.iconbtn svg{width:20px;height:20px}
main{flex:1 1 auto;display:flex;min-height:0;position:relative}
#tray{flex:0 0 38%;position:relative;background:#e7eef7;border-right:1px solid rgba(25,39,81,.08)}
#board{flex:1 1 auto;position:relative;background:#f4f8fc}
.slot{position:absolute;border:2px dashed rgba(25,39,81,.22);border-radius:999px;transition:opacity .2s}
.slot.filled{opacity:.3}
.stick{
  position:absolute;border-radius:999px;z-index:2;cursor:grab;touch-action:none;
  background:linear-gradient(90deg,#ecc897,#ddb37c 55%,#cfa26a);
  border:1px solid rgba(122,84,40,.45);
  box-shadow:0 2px 5px rgba(25,39,81,.18),inset 0 0 0 2px rgba(255,255,255,.28);
  transition:left .2s ease,top .2s ease;
}
.stick.noanim{transition:none}
.stick.dragging{cursor:grabbing;z-index:60;transition:none;box-shadow:0 12px 24px rgba(25,39,81,.32)}
.stick .art{position:absolute;inset:0;border-radius:inherit;overflow:hidden;transition:transform .28s ease}
.stick .art svg{width:100%;height:100%;display:block}
.stick.flipped .art{transform:rotate(180deg)}
footer{flex:0 0 auto;display:flex;justify-content:center;padding:8px 0 12px}
#win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;background:rgba(244,248,252,.35)}
#win[hidden]{display:none}
#win svg{width:min(32vmin,250px);height:auto;filter:drop-shadow(0 10px 20px rgba(25,39,81,.28));animation:pop .45s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#helpModal{position:fixed;inset:0;background:rgba(25,39,81,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#helpModal[hidden]{display:none}
.dialog{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:20px 22px 20px;box-shadow:0 18px 50px rgba(25,39,81,.35)}
.dialog .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dialog h2{font-size:20px;font-weight:900;color:#192751}
.dialog p{font-size:15.5px;line-height:1.6;color:#33415e}
.dialog .iconbtn{width:36px;height:36px}
.dialog .iconbtn svg{width:17px;height:17px}
@media (max-height:700px){
  header{min-height:48px;padding:5px 12px}
  h1{font-size:19px}
  footer{padding:4px 0 8px}
  .btn{padding:6px 13px;font-size:13px}
  .seg button{padding:5px 11px;font-size:13px}
  .iconbtn{width:38px;height:38px}
}

.stick.good{animation:goodflash .7s ease}
@keyframes goodflash{
  0%,60%{box-shadow:0 0 0 5px #34c759,0 2px 5px rgba(25,39,81,.18)}
  100%{box-shadow:0 2px 5px rgba(25,39,81,.18),inset 0 0 0 2px rgba(255,255,255,.28)}
}
.stick.good{border-color:#1d9e45}
#checkBtn{position:absolute;right:18px;bottom:14px;z-index:30}
#winBad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;background:rgba(244,248,252,.35)}
#winBad[hidden]{display:none}
#winBad svg{width:min(32vmin,250px);height:auto;filter:drop-shadow(0 10px 20px rgba(120,20,20,.3));animation:pop .4s ease}
</style>
</head>

const PAINT = {owl, cat, dog, fox, bear, rabbit};

const BGS = ['#fde8d8','#e3f0e4','#fde3e3','#efe6da','#e3edfb','#fde8f3','#e8f6ee','#efe6fb','#fdf3d8'];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generateLevel(diff){
  const n = 8;
  let spans;
  if(diff===0) spans = [2,2,2,2];
  else if(diff===1) spans = Math.random()<0.5 ? [2,2,2,2] : rnd([[3,3,2],[3,2,3],[2,3,3]]);
  else spans = rnd([[3,3,2],[3,2,3],[2,3,3]]);
  shuffle(spans);
  const groupFlips = spans.map(()=> Math.random()<0.45);
  if(groupFlips.length>1 && (groupFlips.every(Boolean) || groupFlips.every(f=>!f))){
    groupFlips[Math.floor(Math.random()*groupFlips.length)] = !groupFlips[0];
  }
  const animals = [];
  const flips = new Array(n).fill(false);
  let col = 0, gi = 0;
  for(const s of spans){
    const F = groupFlips[gi++];
    for(let i=0;i<s;i++) flips[col+i] = F;
    const count = Math.random()<0.55 ? 2 : 1;
    const used = [];
    for(let k=0;k<count;k++){
      const h = 140 + Math.random()*70;
      let y0 = 12, tries = 0;
      do { y0 = 12 + Math.random()*(376-h); tries++; }
      while(tries<50 && used.some(u => y0 < u.y1+10 && y0+h+10 > u.y0));
      used.push({y0, y1: y0+h});
      const t = rnd(Object.keys(PAL));
      animals.push({t, c0: col, c1: col+s-1, y0, y1: y0+h, flip: F, bg: rnd(BGS), p: rnd(PAL[t])});
    }
    col += s;
  }
  return { n, flips, animals };
}
const game = document.getElementById('game');
const trayEl = document.getElementById('tray');
const boardEl = document.getElementById('board');
const artDefs = document.getElementById('artDefs');
const winEl = document.getElementById('win');
const winBadEl = document.getElementById('winBad');
const checkBtn = document.getElementById('checkBtn');
const helpModal = document.getElementById('helpModal');
let level = null, levelIndex = 0;
let sticks = [], boardArr = [], geom = null, drag = null;
function buildArt(lv){
  let s = '';
  for(const a of lv.animals){
    const x = a.c0*100, w = (a.c1-a.c0+1)*100, h = a.y1-a.y0;
    s += `<rect x="${x+4}" y="${a.y0+4}" width="${w-8}" height="${h-8}" rx="22" fill="${a.bg}"/>`;
    const inner = `<svg x="${x+7}" y="${a.y0+7}" width="${w-14}" height="${h-14}" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${PAINT[a.t](a.p)}</svg>`;
    s += a.flip ? `<g transform="rotate(180 ${x+w/2} ${a.y0+h/2})">${inner}</g>` : inner;
  }
  return s;
}
function buildLevel(){
  artDefs.innerHTML = '<defs><g id="art">'+buildArt(level)+'</g></defs>';
  game.querySelectorAll('.stick').forEach(e=>e.remove());
  boardEl.querySelectorAll('.slot').forEach(e=>e.remove());
  sticks = []; boardArr = new Array(level.n).fill(null);
  for(let i=0;i<level.n;i++){
    const el = document.createElement('div');
    el.className = 'stick'; el.dataset.id = i;
    el.setAttribute('role','img');
    const base = level.flips[i] ? `<g transform="rotate(180 ${i*100+50} 200)"><use href="#art"></use></g>` : `<use href="#art"></use>`;
    el.innerHTML = `<div class="art"><svg viewBox="${i*100} 0 100 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${base}</svg></div>`;
    el.addEventListener('contextmenu', e=>e.preventDefault());
    el.addEventListener('animationend', ()=>el.classList.remove('good'));
    attachPointer(el, i);
    game.appendChild(el);
    sticks.push({id:i, el, zone:'tray', slot:-1, cell:i, flip:false});
    const slot = document.createElement('div');
    slot.className = 'slot';
    boardEl.appendChild(slot);
  }
}
function slotXY(i){ return {x: geom.slotX0 + i*(geom.stickW+geom.gap), y: geom.slotY0}; }
function cellXY(c){
  const col = c % geom.cols, row = Math.floor(c / geom.cols);
  const usedW = geom.cols*(geom.stickW+10)-10, usedH = geom.rows*(geom.stickH+10)-10;
  return {
    x: geom.T.x + 9 + Math.max(0,(geom.T.w-18-usedW)/2) + col*(geom.stickW+10),
    y: geom.T.y + 7 + Math.max(0,(geom.T.h-14-usedH)/2) + row*(geom.stickH+10)
  };
}
function stickPos(st){ return st.zone==='board' ? slotXY(st.slot) : cellXY(st.cell); }
function posStick(st, anim=true){
  const p = stickPos(st);
  if(!anim) st.el.classList.add('noanim');
  st.el.style.left = p.x+'px';
  st.el.style.top = p.y+'px';
  if(!anim){ void st.el.offsetWidth; st.el.classList.remove('noanim'); }
}
function layout(){
  const gr = game.getBoundingClientRect();
  const tr = trayEl.getBoundingClientRect(), br = boardEl.getBoundingClientRect();
  const T = {x:tr.left-gr.left, y:tr.top-gr.top, w:tr.width, h:tr.height};
  const B = {x:br.left-gr.left, y:br.top-gr.top, w:br.width, h:br.height};
  let stickH = Math.min(T.h, B.h)*0.94, gap = 3;
  for(let guard=0; guard<90; guard++){
    const stickW = stickH/5.2;
    const needW = level.n*stickW + (level.n-1)*gap;
    if(needW <= B.w-14){
      const cols = Math.max(1, Math.floor((T.w-18)/(stickW+10)));
      const rows = Math.ceil(level.n/cols);
      if(rows*(stickH+10) <= T.h-14) break;
    }
    stickH *= 0.94;
  }
  const stickW = stickH/5.2;
  const cols = Math.max(1, Math.floor((T.w-18)/(stickW+10)));
  const rows = Math.ceil(level.n/cols);
  const totalW = level.n*stickW + (level.n-1)*gap;
  geom = {T, B, stickW, stickH, gap, cols, rows,
          slotX0: B.x + (B.w-totalW)/2, slotY0: B.y + (B.h-stickH)/2,
          gameW: gr.width, gameH: gr.height};
  sticks.forEach(st=>{
    st.el.style.width = stickW+'px';
    st.el.style.height = stickH+'px';
    posStick(st, false);
  });
  boardEl.querySelectorAll('.slot').forEach((s,i)=>{
    s.style.width = stickW+'px';
    s.style.height = stickH+'px';
    s.style.left = (geom.slotX0-B.x + i*(stickW+gap))+'px';
    s.style.top = (geom.slotY0-B.y)+'px';
    s.classList.toggle('filled', !!boardArr[i]);
  });
}
function attachPointer(el, id){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    drag = {pid:e.pointerId, sx:e.clientX, sy:e.clientY,
            ox:parseFloat(el.style.left)||0, oy:parseFloat(el.style.top)||0,
            moved:false, x:0, y:0, st:sticks[id]};
    el.classList.add('dragging');
    el.style.zIndex = 60;
  });
  el.addEventListener('pointermove', e=>{
    if(!drag || drag.pid!==e.pointerId) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if(!drag.moved && Math.hypot(dx,dy)>10) drag.moved = true;
    if(drag.moved){
      let nx = drag.ox+dx, ny = drag.oy+dy;
      nx = Math.max(0, Math.min(geom.gameW-geom.stickW, nx));
      ny = Math.max(0, Math.min(geom.gameH-geom.stickH, ny));
      drag.x = nx; drag.y = ny;
      el.style.left = nx+'px';
      el.style.top = ny+'px';
    }
  });
  el.addEventListener('pointerup', e=>{
    if(!drag || drag.pid!==e.pointerId) return;
    const d = drag; drag = null;
    el.classList.remove('dragging');
    el.style.zIndex = '';
    if(!d.moved){
      d.st.flip = !d.st.flip;
      d.st.el.classList.toggle('flipped', d.st.flip);
      flashGood(d.st);
      updateCheckBtn();
      return;
    }
    handleDrop(d.st, d.x, d.y);
  });
  el.addEventListener('pointercancel', e=>{
    if(!drag || drag.pid!==e.pointerId) return;
    drag = null;
    el.classList.remove('dragging');
    el.style.zIndex = '';
    posStick(sticks[id]);
  });
}
function handleDrop(st, x, y){
  const cx = x+geom.stickW/2, cy = y+geom.stickH/2;
  const B = geom.B, T = geom.T;
  const inBoard = cx>B.x-30 && cx<B.x+B.w+30 && cy>B.y-30 && cy<B.y+B.h+30;
  if(inBoard){
    let best = 0, bd = Infinity;
    for(let i=0;i<level.n;i++){
      const s = slotXY(i);
      const d = Math.hypot(cx-(s.x+geom.stickW/2), cy-(s.y+geom.stickH/2));
      if(d<bd){ bd=d; best=i; }
    }
    const inside = cx>B.x && cx<B.x+B.w && cy>B.y && cy<B.y+B.h;
    if(bd < Math.max(geom.stickW*1.5, 90) || inside) placeInSlot(st, best);
    else posStick(st);
  } else if(cx>T.x && cx<T.x+T.w && cy>T.y && cy<T.y+T.h){
    const cell = nearestFreeCell(cx, cy, st);
    if(cell !== null){
      if(st.zone==='board'){ boardArr[st.slot] = null; }
      st.zone = 'tray'; st.slot = -1; st.cell = cell;
      posStick(st);
    } else posStick(st);
  } else {
    posStick(st);
  }
  refreshSlots(); flashGood(st); updateCheckBtn();
}
function nearestFreeCell(cx, cy, st){
  let best = null, bd = Infinity;
  for(let c=0; c<geom.cols*geom.rows; c++){
    let used = false;
    for(const o of sticks){
      if(o!==st && o.zone==='tray' && o.cell===c){ used = true; break; }
    }
    if(used) continue;
    const p = cellXY(c);
    const d = Math.hypot(cx-(p.x+geom.stickW/2), cy-(p.y+geom.stickH/2));
    if(d<bd){ bd=d; best=c; }
  }
  return best;
}
function firstFreeCell(except){
  for(let c=0; c<geom.cols*geom.rows; c++){
    let used = false;
    for(const o of sticks){
      if(o!==except && o.zone==='tray' && o.cell===c){ used = true; break; }
    }
    if(!used) return c;
  }
  return 0;
}
function placeInSlot(st, slot){
  const occ = boardArr[slot];
  if(st.zone==='board'){
    const old = st.slot;
    if(occ===st){ posStick(st); return; }
    boardArr[old] = occ || null;
    if(occ){ occ.slot = old; posStick(occ); }
    boardArr[slot] = st; st.slot = slot;
    posStick(st);
  } else {
    if(occ){
      occ.zone = 'tray'; occ.slot = -1; occ.cell = st.cell;
      posStick(occ);
    }
    st.zone = 'board'; st.slot = slot;
    boardArr[slot] = st;
    posStick(st);
  }
}
function refreshSlots(){
  boardEl.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('filled', !!boardArr[i]));
}
function stickGood(st){
  return st.zone==='board' && st.slot===st.id && st.flip===level.flips[st.id];
}
function flashGood(st){
  if(!stickGood(st)) return;
  st.el.classList.remove('good');
  void st.el.offsetWidth;
  st.el.classList.add('good');
}
function boardFull(){ return boardArr.every(Boolean); }
function isSolved(){
  for(let i=0;i<level.n;i++){
    const st = boardArr[i];
    if(!st || st.id!==i || st.flip!==level.flips[i]) return false;
  }
  return true;
}
function updateCheckBtn(){ checkBtn.hidden = !boardFull(); }
function onCheck(){
  if(!boardFull()) return;
  if(isSolved()){
    winEl.hidden = false;
    updateCheckBtn();
    return;
  }
  winBadEl.hidden = false;
  setTimeout(()=>{ winBadEl.hidden = true; }, 1500);
  for(let i=0;i<level.n;i++){
    const st = boardArr[i];
    if(!st) continue;
    if(!(st.id===i && st.flip===level.flips[i])){
      boardArr[i] = null;
      st.zone = 'tray'; st.slot = -1; st.cell = firstFreeCell(st);
      posStick(st);
    }
  }
  refreshSlots(); updateCheckBtn();
}
function newGame(){
  winEl.hidden = true; winBadEl.hidden = true;
  level = generateLevel(levelIndex);
  buildLevel();
  const order = shuffle([...Array(level.n).keys()]);
  sticks.forEach((st,i)=>{
    st.zone = 'tray'; st.slot = -1; st.cell = order[i];
    st.flip = Math.random() < 0.5;
    st.el.classList.toggle('flipped', st.flip);
  });
  boardArr = new Array(level.n).fill(null);
  layout();
  refreshSlots(); updateCheckBtn();
}
function setLevel(i){
  levelIndex = i;
  document.querySelectorAll('#difficulty button').forEach(b=>b.classList.toggle('active', +b.dataset.l===i));
  newGame();
}
checkBtn.addEventListener('click', onCheck);
document.querySelectorAll('#difficulty button').forEach(b=>{
  b.addEventListener('click', ()=>setLevel(+b.dataset.l));
});
document.getElementById('newGame').addEventListener('click', ()=>{ newGame(); });
document.getElementById('helpBtn').addEventListener('click', ()=>{ helpModal.hidden = false; document.getElementById('helpClose').focus(); });
document.getElementById('helpClose').addEventListener('click', ()=>{ helpModal.hidden = true; });
helpModal.addEventListener('click', e=>{ if(e.target===helpModal) helpModal.hidden = true; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !helpModal.hidden) helpModal.hidden = true; });
document.getElementById('fsBtn').addEventListener('click', ()=>{
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(_){}
});
window.addEventListener('resize', ()=>layout());
setLevel(0);
</script>
</body>
</html>
