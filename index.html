<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staviame z paličiek</title>
<style>
  :root{
    --bg:#fdfaf4;
    --ink:#3d2e1e;
    --ink-soft:#8a7a66;
    --easy:#2e7d32;
    --easy-bg:#e7f3e7;
    --medium:#e56b00;
    --medium-bg:#fdeedd;
    --hard:#c0392b;
    --hard-bg:#fae4e1;
    --stick-outline:#6e4423;
    --stick-body:#eac28f;
    --stick-hi:#f8e3bd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{display:none!important}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  .screen{height:100dvh;display:flex;flex-direction:column}

  /* ---------- Úvodná obrazovka ---------- */
  #scr-intro{align-items:center;justify-content:center;gap:3.2vh;padding:2.5vh 4vw}
  #intro-top{position:fixed;top:1.6vh;right:1.8vw}
  h1{
    font-size:clamp(2.4rem,6.4vw,5.2rem);
    font-weight:900;letter-spacing:.06em;text-align:center;
  }
  #instrukcia{
    font-size:clamp(1.15rem,2.5vw,1.9rem);
    color:var(--ink-soft);text-align:center;
  }
  #levels{display:grid;grid-template-columns:repeat(3,minmax(230px,25vw));gap:2.2vw;width:100%;justify-content:center}
  .level{
    border-radius:22px;
    padding:3.2vh 1.5vw;
    display:flex;flex-direction:column;align-items:center;gap:1.1vh;
    color:#fff;text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.14);
    transition:transform .08s;
  }
  .level:active{transform:translateY(3px)}
  .level[data-level="easy"]{background:var(--easy)}
  .level[data-level="medium"]{background:var(--medium)}
  .level[data-level="hard"]{background:var(--hard)}
  .lv-cislo{
    font-size:clamp(.95rem,1.6vw,1.3rem);font-weight:700;opacity:.85;letter-spacing:.12em;
  }
  .lv-nazov{font-size:clamp(1.9rem,3.6vw,3rem);font-weight:900;letter-spacing:.05em;line-height:1.05}
  .lv-sk{font-size:clamp(1.2rem,2.4vw,1.9rem);font-weight:700;opacity:.95}
  .lv-prog{
    margin-top:.8vh;font-size:clamp(.95rem,1.7vw,1.35rem);font-weight:600;
    background:rgba(255,255,255,.22);border-radius:999px;padding:.45em 1.1em;
    line-height:1.25;
  }
  .lv-prog.done{background:#fff;color:var(--ink)}
  .lv-repeat{
    display:none;margin-top:.6vh;
    font-size:clamp(.9rem,1.5vw,1.2rem);font-weight:800;letter-spacing:.08em;
    background:rgba(255,255,255,.92);color:var(--ink);
    border-radius:12px;padding:.5em 1.2em;
  }
  .level.done .lv-repeat{display:inline-block}
  #intro-foot{margin-top:1vh}
  .ghost{
    color:var(--ink-soft);
    font-size:clamp(.85rem,1.4vw,1.1rem);
    font-weight:600;letter-spacing:.05em;
    padding:.55em 1em;border-radius:10px;
    border:1.5px solid rgba(0,0,0,.12);
    background:rgba(255,255,255,.6);
  }
  .ghost:hover{background:#fff}

  /* ---------- Herná obrazovka ---------- */
  #scr-game{padding:1.6vh 2.2vw 2vh}
  #gamehead{
    display:flex;align-items:center;justify-content:space-between;
    gap:1vw;min-height:4.6vh;
  }
  #hud{font-size:clamp(1rem,1.9vw,1.5rem);font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
  #btn-fs{flex:none}
  #stage{flex:1;min-height:0;position:relative}
  #stage svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .28s ease}
  #figname{
    text-align:center;font-size:clamp(1rem,1.8vw,1.45rem);font-weight:600;
    color:var(--ink-soft);margin-top:.4vh;
  }
  #count{
    text-align:center;font-size:clamp(1.4rem,2.8vw,2.3rem);font-weight:800;
    margin-top:.3vh;
  }
  #btn-next{
    display:block;margin:1.4vh auto 0;
    background:var(--easy);color:#fff;
    font-size:clamp(1.5rem,2.9vw,2.4rem);font-weight:900;letter-spacing:.06em;
    padding:.55em 1.6em;border-radius:18px;
    box-shadow:0 5px 0 rgba(0,0,0,.18);
    transition:transform .08s,background-color .2s;
  }
  #btn-next:active{transform:translateY(3px)}
  #btn-next:disabled{opacity:.55;cursor:default;transform:none}
  #btn-next.vyber{background:#5c4a36}

  /* ---------- Galéria (skrytá controla: #galeria) ---------- */
  #scr-gallery{overflow:auto;padding:2vh 2vw;gap:1.5vh}
  #scr-gallery h2{font-size:1.6rem;text-align:center}
  #gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh 1.2vw}
  .gal-tile{background:#fff;border:1px solid #e5ddcf;border-radius:12px;padding:.6vh .4vw;text-align:center}
  .gal-tile svg{width:100%;aspect-ratio:4/3;display:block}
  .gal-tile .gn{font-weight:700;font-size:.95rem;margin-top:.3vh}
  .gal-tile .gc{font-size:.8rem;color:var(--ink-soft)}

  /* ---------- Dialóg potvrdenia ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(40,28,12,.45);
    display:flex;align-items:center;justify-content:center;z-index:50;
  }
  #dialog{
    background:#fff;border-radius:20px;padding:4vh 3vw;max-width:520px;width:88vw;
    display:flex;flex-direction:column;gap:2.4vh;text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  #dialog h3{font-size:clamp(1.3rem,2.6vw,1.9rem)}
  #dialog p{font-size:clamp(1rem,2vw,1.3rem);color:var(--ink-soft)}
  #dialog-btns{display:flex;gap:1.2vw;justify-content:center}
  #dialog-btns button{
    font-size:clamp(1.05rem,2vw,1.4rem);font-weight:800;letter-spacing:.04em;
    padding:.6em 1.5em;border-radius:14px;
  }
  #dlg-cancel{background:#efe9df;color:var(--ink)}
  #dlg-ok{background:var(--hard);color:#fff}

  @media (max-width:900px){
    #levels{grid-template-columns:min(92vw,430px)}
    #scr-game{padding:1.2vh 3vw 1.6vh}
  }
</style>
</head>
<body>

<!-- ==================== ÚVOD ==================== -->
<section id="scr-intro" class="screen">
  <button id="intro-fs" class="ghost">CELÁ OBRAZOVKA</button>
  <h1>STAVIAME Z PALIČIEK</h1>
  <p id="instrukcia">Vyber si úroveň a postav obrazec z paličiek na lavici.</p>
  <div id="levels">
    <button class="level" data-level="easy">
      <span class="lv-cislo">1. ÚROVEŇ</span>
      <span class="lv-nazov">EASY</span>
      <span class="lv-sk">ĽAHKÁ</span>
      <span class="lv-prog" id="prog-easy"></span>
      <span class="lv-repeat">ZOPAKOVAŤ ÚROVEŇ</span>
    </button>
    <button class="level" data-level="medium">
      <span class="lv-cislo">2. ÚROVEŇ</span>
      <span class="lv-nazov">MEDIUM</span>
      <span class="lv-sk">STREDNÁ</span>
      <span class="lv-prog" id="prog-medium"></span>
      <span class="lv-repeat">ZOPAKOVAŤ ÚROVEŇ</span>
    </button>
    <button class="level" data-level="hard">
      <span class="lv-cislo">3. ÚROVEŇ</span>
      <span class="lv-nazov">HARD</span>
      <span class="lv-sk">ŤAŽKÁ</span>
      <span class="lv-prog" id="prog-hard"></span>
      <span class="lv-repeat">ZOPAKOVAŤ ÚROVEŇ</span>
    </button>
  </div>
  <div id="intro-foot">
    <button id="btn-reset" class="ghost">VYNULOVAŤ CELÝ POSTUP</button>
  </div>
</section>

<!-- ==================== HRA ==================== -->
<section id="scr-game" class="screen" hidden>
  <header id="gamehead">
    <span id="hud"></span>
    <button id="btn-fs" class="ghost">CELÁ OBRAZOVKA</button>
  </header>
  <div id="stage"></div>
  <div id="figname"></div>
  <div id="count"></div>
  <button id="btn-next">ĎALŠÍ OBRAZ</button>
</section>

<!-- ==================== GALÉRIA (skrytá, len pre kontrolu: #galeria) ==================== -->
<section id="scr-gallery" class="screen" hidden>
  <h2 id="gal-title"></h2>
  <div id="gal-grid"></div>
</section>

<!-- ==================== POTVRDENIE ==================== -->
<div id="overlay" hidden>
  <div id="dialog">
    <h3>Vynulovať celý postup?</h3>
    <p>Vymaže sa uložený postup vo všetkých troch úrovniach. Aplikácia začne od prvého obrazca.</p>
    <div id="dialog-btns">
      <button id="dlg-cancel">ZRUŠIŤ</button>
      <button id="dlg-ok">VYNULOVAŤ</button>
    </div>
  </div>
</div>

<script>
/*DATA-START*/
/* ============================================================
   DÁTOVÁ VRSTVA – 60 obrazcov z paličiek
   Každá palička má dĺžku presne 1 (vo vlastných jednotkách
   obrazca). Paličky sa iba posúvajú a otáčajú – nikdy nedeformujú.
   Štvorcová mriežka: vodorovné H a zvislé V paličky.
   Trojuholníková mriežka: šikmé paličky UR, UL, DR, DL
   (výška radu T = √3/2, preto je šikmá palička tiež dĺžky 1).
   ============================================================ */
const T = Math.sqrt(3) / 2;
const H  = (x, y) => [[x, y], [x + 1, y]];
const V  = (x, y) => [[x, y], [x, y + 1]];
const UR = (x, y) => [[x, y], [x + 0.5, y + T]];
const UL = (x, y) => [[x + 1, y], [x + 0.5, y + T]];
const DR = (x, y) => [[x, y], [x + 0.5, y - T]];
const DL = (x, y) => [[x + 1, y], [x + 0.5, y - T]];

/* Obrys päťcipej hviezdy – 10 rovnako dlhých paličiek, bez kríženia */
function hviezda5() {
  const R = 1, r = R * Math.sin(Math.PI / 10) / Math.sin(3 * Math.PI / 10), s = [];
  for (let k = 0; k < 5; k++) {
    const aO1 = (90 + 72 * k) * Math.PI / 180;
    const aI  = (90 + 36 + 72 * k) * Math.PI / 180;
    const aO2 = (90 + 72 * (k + 1)) * Math.PI / 180;
    const O1 = [R * Math.cos(aO1), R * Math.sin(aO1)];
    const I  = [r * Math.cos(aI),  r * Math.sin(aI)];
    const O2 = [R * Math.cos(aO2), R * Math.sin(aO2)];
    s.push([O1, I], [I, O2]);
  }
  return s;
}
/* Obrys šesťcipej hviezdy – 12 rovnako dlhých paličiek, bez kríženia */
function hviezda6() {
  const R = 1, r = 1 / Math.sqrt(3), s = [];
  for (let k = 0; k < 6; k++) {
    const aO1 = (90 + 60 * k) * Math.PI / 180;
    const aI  = (90 + 30 + 60 * k) * Math.PI / 180;
    const aO2 = (90 + 60 * (k + 1)) * Math.PI / 180;
    const O1 = [R * Math.cos(aO1), R * Math.sin(aO1)];
    const I  = [r * Math.cos(aI),  r * Math.sin(aI)];
    const O2 = [R * Math.cos(aO2), R * Math.sin(aO2)];
    s.push([O1, I], [I, O2]);
  }
  return s;
}
/* Šesťuholník so stranou 1 (použije ho aj hodiny, slnko, kocka) */
function sextuholnik() {
  return [H(0.5, 0), UR(1.5, 0), UL(1, T), H(0.5, 2 * T), UR(0, T), UL(-0.5, 0)];
}

const FIGURES = {

/* ---------------- EASY – ĽAHKÁ (3–12 paličiek) ---------------- */
easy: [
  { n: "Trojuholník", s: [
    H(0,0), UR(0,0), UL(0,0)
  ]},
  { n: "Štvorec", s: [
    H(0,0), H(0,1), V(0,0), V(1,0)
  ]},
  { n: "Písmeno L", s: [
    V(0,0), V(0,1), H(0,0), H(1,0)
  ]},
  { n: "Schodíky", s: [
    V(0,0), H(0,1), V(1,1), H(1,2)
  ]},
  { n: "Písmeno T", s: [
    H(0,2), H(1,2), V(1,0), V(1,1)
  ]},
  { n: "Znamienko plus", s: [
    V(0,0), V(0,1), H(-1,1), H(0,1)
  ]},
  { n: "Kosoštvorec", s: [
    H(0,0), UR(1,0), H(0.5,T), UR(0,0)
  ]},
  { n: "Šípka", s: [
    H(0,0), H(1,0), UL(1,0), DL(1,0)
  ]},
  { n: "Písmeno E", s: [
    V(0,0), V(0,1), H(0,2), H(0,1), H(0,0)
  ]},
  { n: "Písmeno U", s: [
    H(0,0), V(0,0), V(0,1), V(1,0), V(1,1)
  ]},
  { n: "Stromček", s: [
    V(0.5,0), UR(0.5,1), UL(0,1+T), UR(0,1+T), UL(-0.5,1)
  ]},
  { n: "Dva trojuholníky", s: [
    H(0,0), UR(1,0), H(0.5,T), UR(0,0), UL(0,0)
  ]},
  { n: "Písmeno I", s: [
    H(0,2), H(1,2), V(1,1), V(1,0), H(0,0), H(1,0)
  ]},
  { n: "Domeček", s: [
    H(0,0), H(0,1), V(0,0), V(1,0), UR(0,1), UL(0,1)
  ]},
  { n: "Vlajka", s: [
    V(0,0), V(0,1), V(0,2), H(0,2), V(1,2), H(0,3)
  ]},
  { n: "Obdĺžnik", s: [
    H(0,0), H(1,0), H(0,1), H(1,1), V(0,0), V(2,0)
  ]},
  { n: "Veľký trojuholník", s: [
    H(0,0), H(1,0), UR(0,0), UR(0.5,T), UL(1,0), UL(0.5,T)
  ]},
  { n: "Trapec", s: [
    H(0,0), H(1,0), H(2,0), UR(0,0), UL(2,0), H(0.5,T), H(1.5,T)
  ]},
  { n: "Dva štvorce", s: [
    H(0,0), H(1,0), H(0,1), H(1,1), V(0,0), V(1,0), V(2,0)
  ]},
  { n: "Veľký štvorec", s: [
    H(0,0), H(1,0), H(0,2), H(1,2), V(0,0), V(0,1), V(2,0), V(2,1)
  ]}
],

/* ---------------- MEDIUM – STREDNÁ (6–18 paličiek) ---------------- */
medium: [
  { n: "Šesťuholník", s: sextuholnik() },
  { n: "Ryba", s: [
    H(0,0), UR(1,0), H(0.5,T), UR(0,0),
    UL(-1,0), H(-0.5,T)
  ]},
  { n: "Kríž", s: [
    V(0,0), V(0,1), V(0,2), H(-2,2), H(-1,2), H(0,2), H(1,2)
  ]},
  { n: "Lucerna", s: [
    H(-1,-1), H(0,-1), V(0,-1), V(0,0),
    UR(0,1), UL(-0.5,1+T), UR(-0.5,1+T), UL(-1,1)
  ]},
  { n: "Rebrík", s: [
    V(0,0), V(0,1), V(2,0), V(2,1),
    H(0,0), H(1,0), H(0,1), H(1,1)
  ]},
  { n: "Kľúč", s: [
    H(0,0), H(0,1), V(0,0), V(1,0),
    H(1,0), H(2,0), V(2,-1), V(3,-1)
  ]},
  { n: "Hodiny", s: [
    H(0.5,0), UR(1.5,0), UL(1,T), H(0.5,2*T), UR(0,T), UL(-0.5,0),
    H(0,T), DR(1,T)
  ]},
  { n: "Okuliare", s: [
    H(0,0), H(0,1), V(0,0), V(1,0),
    H(2,0), H(2,1), V(2,0), V(3,0),
    H(1,0)
  ]},
  { n: "Domček", s: [
    H(0,0), H(1,0), H(0,1), H(1,1), V(0,0), V(2,0),
    UR(0,1), UR(0.5,1+T), UL(1,1), UL(0.5,1+T)
  ]},
  { n: "Strom", s: [
    V(0.5,0), V(0.5,1),
    UR(0.5,2), UL(0,2+T), UR(0,2+T), UL(-0.5,2),
    UR(0.5,2+2*T), UL(0,2+3*T), UR(0,2+3*T), UL(-0.5,2+2*T)
  ]},
  { n: "Kvet", s: [
    V(0,0), V(0,1),
    UR(0,1), DR(0.5,1+T), DL(0,1), UL(-0.5,1-T),
    UR(0,2), UL(-0.5,2+T), UR(-0.5,2+T), UL(-1,2)
  ]},
  { n: "Raketa", s: [
    H(0,0), H(0,2), V(0,0), V(0,1), V(1,0), V(1,1),
    UR(0,2), UL(0,2), DL(-1,0), DR(1,0)
  ]},
  { n: "Päťcípa hviezda", s: hviezda5() },
  { n: "Loď", s: [
    H(0,0), H(1,0), H(2,0), UR(0,0), UL(2,0), H(0.5,T), H(1.5,T),
    V(1.5,T), H(1.5,1+T), UL(1.5,1+T), UR(1.5,1+T)
  ]},
  { n: "Prasa", s: [
    H(0,0), UR(1,0), H(0.5,T), UR(0,0),
    H(1,0), UL(1,0),
    H(2,0), UR(1.5,T), DL(-1,0),
    V(0,-1), V(1,-1)
  ]},
  { n: "Šesťcípa hviezda", s: hviezda6() },
  { n: "Slnko", s: [
    H(0.5,0), UR(1.5,0), UL(1,T), H(0.5,2*T), UR(0,T), UL(-0.5,0),
    DL(-0.5,0), DR(1.5,0), H(2,T), UR(1.5,2*T), UL(-0.5,2*T), H(-1,T)
  ]},
  { n: "Kačka", s: [
    H(0,0), H(1,0), UR(0,0), UR(0.5,T), UL(1,0), UL(0.5,T),
    V(1,2*T),
    UR(1,1+2*T), UL(0.5,1+3*T), DL(0,1+4*T), DR(0.5,1+3*T),
    H(1.5,1+3*T)
  ]},
  { n: "Mačka", s: [
    H(0,0), H(1,0), H(0,1), H(1,1), V(0,0), V(2,0),
    H(2,0), H(2,1), V(3,0),
    UR(2,1), UL(2,1), UL(-1,1),
    V(0,-1), V(1,-1), V(2,-1)
  ]},
  { n: "Auto", s: [
    H(0,0), H(1,0), H(2,0), H(0,1), H(1,1), H(2,1), V(0,0), V(3,0),
    V(1,1), V(2,1), H(1,2),
    V(0,-1), V(1,-1), H(0,-1), V(2,-1), V(3,-1), H(2,-1)
  ]}
],

/* ---------------- HARD – ŤAŽKÁ (najviac 20 paličiek) ---------------- */
hard: [
  { n: "Stolička", s: [
    V(0,0), V(0,1), V(0,2), H(0,1), H(1,1), V(2,0)
  ]},
  { n: "Stôl", s: [
    H(0,2), H(1,2), H(2,2), V(0,0), V(0,1), V(3,0), V(3,1)
  ]},
  { n: "Most", s: [
    H(0,1), H(1,1), V(0,0), V(2,0),
    DR(0,0), UR(0.5,-T), DR(1,0), UR(1.5,-T)
  ]},
  { n: "Strecha", s: [
    H(0,0), H(1,0), UR(0,0), UR(0.5,T), UL(1,0), UL(0.5,T),
    UL(0,0), UR(1,0)
  ]},
  { n: "Žeriav", s: [
    V(0,0), V(0,1), V(0,2),
    H(0,3), H(1,3), H(-1,3),
    V(2,1), V(2,2)
  ]},
  { n: "Kocka", s: [
    H(0.5,0), UR(1.5,0), UL(1,T), H(0.5,2*T), UR(0,T), UL(-0.5,0),
    UR(0.5,0), H(1,T), UL(0,T)
  ]},
  { n: "Eiffelovka", s: [
    V(0,2), V(0,1),
    DR(0,1), DR(0.5,1-T),
    DL(-1,1), DL(-1.5,1-T),
    H(-0.5,1-T), H(-1,1-2*T), H(0,1-2*T)
  ]},
  { n: "Kotva", s: [
    V(0,0), V(0,1),
    UR(0,2), UL(-0.5,2+T), UR(-0.5,2+T), UL(-1,2),
    H(-1,1), H(0,1),

  { n: "Autobus", s: [

  ]},
  { n: "Pes", s: [
    H(0,0), H(1,0), H(0,1), H(1,1), V(0,0), V(2,0),

    UR(-0.5,1+T), UR(2,1),

  ]},
  { n: "Váha", s: [
    H(0,0), H(1,0),
    V(1,0), V(1,1), V(1,2),

    V(0,2), V(2,2),
    H(-0.5,2-T), UR(-0.5,2-T), UL(-0.5,2-T),

  { n: "Raketa na štarte", s: [
    H(0,0), H(0,2), V(0,0), V(0,1), V(1,0), V(1,1),

    H(-1.5,-T), H(-0.5,-T), H(0.5,-T), H(1.5,-T),

  { n: "Krava", s: [
    H(0,0), H(1,0), H(2,0), H(0,1), H(1,1), H(2,1), V(0,0), V(3,0),
    H(3,0), H(3,1), V(4,0),

  { n: "Kamenný most", s: [
    H(0,2), H(1,2), H(2,2), H(3,2),

    DR(0,0), UR(0.5,-T), DR(1,0), UR(1.5,-T),
    DR(2,0), UR(2.5,-T), DR(3,0), UR(3.5,-T)
  ]},
  { n: "Vlak", s: [
    H(0,0), H(1,0), H(0,1), H(1,1), V(0,0), V(2,0),

    H(2,0),
    H(3,0), H(4,0), H(3,1), H(4,1), V(3,0), V(5,0),

</script>

<script>
/* ============================================================
   APLIKÁCIA
   ============================================================ */
(function () {
  "use strict";

  const LEVELS = [
    { id: "easy",   label: "EASY",   sk: "ĽAHKÁ"   },
    { id: "medium", label: "MEDIUM", sk: "STREDNÁ" },
    { id: "hard",   label: "HARD",   sk: "ŤAŽKÁ"   }
  ];
  const CYKEL = 5;               // obrazcov na cyklus
  const STORE_KEY = "staviame-z-paliciek-v1";

  /* ---------- uloženie postupu ---------- */
  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        return {
          easy:   Math.min(20, Math.max(0, p.easy   | 0)),
          medium: Math.min(20, Math.max(0, p.medium | 0)),
          hard:   Math.min(20, Math.max(0, p.hard   | 0))
        };
      }
    } catch (e) { /* pokračujeme s nulami */ }
    return { easy: 0, medium: 0, hard: 0 };
  }
  function saveProgress() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  let progress = loadProgress();

  /* ---------- prvky ---------- */
  const $ = (id) => document.getElementById(id);
  const scrIntro = $("scr-intro"), scrGame = $("scr-game"), scrGallery = $("scr-gallery");
  const stage = $("stage"), hud = $("hud"), figname = $("figname"), count = $("count");
  const btnNext = $("btn-next");

  /* ---------- zobrazenie obrazoviek ---------- */
  function showScreen(el) {
    for (const s of [scrIntro, scrGame, scrGallery]) s.hidden = (s !== el);
  }

  /* ---------- vykreslenie paličiek ---------- */
  const SVGNS = "http://www.w3.org/2000/svg";
  const INSET = 0.075;                 // odsadenie konca paličky (viditeľná medzera)
  const W_OUT = 0.20, W_BODY = 0.13, W_HI = 0.05;
  const PAD = 0.32;                    // bezpečný okraj vo viewBoxe

  function drawFigure(svg, fig) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    // SVG má os Y smerom nadol – geometria počíta s osou Y nahor,
    // preto pri vykresľovaní prelomíme y (-y).
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [[x1, y1], [x2, y2]] of fig.s) {
      minX = Math.min(minX, x1, x2); maxX = Math.max(maxX, x1, x2);
      minY = Math.min(minY, -y1, -y2); maxY = Math.max(maxY, -y1, -y2);
    }
    svg.setAttribute("viewBox",
      (minX - PAD) + " " + (minY - PAD) + " " + (maxX - minX + 2 * PAD) + " " + (maxY - minY + 2 * PAD));
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    const lines = [];
    for (const [[x1, y1], [x2, y2]] of fig.s) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const ax = x1 + ux * INSET, ay = -(y1 + uy * INSET);
      const bx = x2 - ux * INSET, by = -(y2 - uy * INSET);
      lines.push([ax, ay, bx, by]);
    }
    const mk = (cls, w) => {
      const g = document.createElementNS(SVGNS, "g");
      for (const [ax, ay, bx, by] of lines) {
        const l = document.createElementNS(SVGNS, "line");
        l.setAttribute("x1", ax); l.setAttribute("y1", ay);
        l.setAttribute("x2", bx); l.setAttribute("y2", by);
        l.setAttribute("stroke-linecap", "round");
        l.setAttribute("stroke-width", w);
        l.setAttribute("class", cls);
        g.appendChild(l);
      }
      svg.appendChild(g);
    };
    const st = document.createElementNS(SVGNS, "style");
    st.textContent =
      ".so{stroke:var(--stick-outline)}" +
      ".sb{stroke:var(--stick-body)}" +
      ".sh{stroke:var(--stick-hi)}";
    svg.appendChild(st);
    mk("so", W_OUT);
    mk("sb", W_BODY);
    mk("sh", W_HI);
  }

  function makeSvg() {
    const svg = document.createElementNS(SVGNS, "svg");
    return svg;
  }

  /* ---------- úvodná obrazovka ---------- */
  function renderIntro() {
    for (const lv of LEVELS) {
      const card = document.querySelector('.level[data-level="' + lv.id + '"]');
      const prog = $("prog-" + lv.id);
      const done = progress[lv.id] >= 20;
      card.classList.toggle("done", done);
      if (done) {
        prog.textContent = "Všetky obrazce dokončené ✓";
      } else if (progress[lv.id] === 0) {
        prog.textContent = "Začneš obrazcom 1";
      } else {
        const cyklus = Math.floor(progress[lv.id] / CYKEL) + 1;
        prog.textContent = "Pokračuješ obrazcom " + (progress[lv.id] + 1) +
                           " · " + cyklus + ". cyklus";
      }
    }
    showScreen(scrIntro);
  }

  /* ---------- herná obrazovka ---------- */
  let game = null;      // { lv, idx, busy }
  let gameSvg = null;

  function paličkySlovom(n) {
    if (n === 1) return "paličku";
    if (n >= 2 && n <= 4) return "paličky";
    return "paličiek";
  }

  function renderGame() {
    const lv = game.lv, idx = game.idx;
    const fig = FIGURES[lv.id][idx];
    const pos = idx % CYKEL;
    const cyklus = Math.floor(idx / CYKEL) + 1;

    if (!gameSvg) { gameSvg = makeSvg(); stage.appendChild(gameSvg); }
    drawFigure(gameSvg, fig);

    hud.textContent = lv.label + " · " + cyklus + ". cyklus · Obrazec " + (pos + 1) + " z " + CYKEL;
    figname.textContent = fig.n;
    count.textContent = "Potrebuješ " + fig.s.length + " " + paličkySlovom(fig.s.length) + ".";

    btnNext.textContent = (pos === CYKEL - 1) ? "VÝBER ÚROVNE" : "ĎALŠÍ OBRAZ";
    btnNext.classList.toggle("vyber", pos === CYKEL - 1);
    btnNext.disabled = false;
    gameSvg.style.opacity = "1";
  }

  function startLevel(lvId) {
    game = { lv: LEVELS.find(l => l.id === lvId), idx: progress[lvId], busy: false };
    renderGame();
    showScreen(scrGame);
  }

  btnNext.addEventListener("click", () => {
    if (!game || game.busy) return;          // 1. blokácia opakovaného kliknutia
    game.busy = true;
    btnNext.disabled = true;

    const pos = game.idx % CYKEL;
    const jePoslednyVCykle = (pos === CYKEL - 1);
    const jeKoniecUrovne = (game.idx === 19);

    // označ aktuálny obrazec za dokončený
    progress[game.lv.id] = Math.max(progress[game.lv.id], game.idx + 1);
    saveProgress();

    if (jePoslednyVCykle) {
      // 2. skry obrazec, vráť na výber úrovní
      if (gameSvg) gameSvg.style.opacity = "0";
      setTimeout(() => {
        game = null;
        renderIntro();
      }, 550);
      return;
    }

    // 2. skry aktuálny obrazec
    if (gameSvg) gameSvg.style.opacity = "0";
    setTimeout(() => { if (gameSvg) gameSvg.style.opacity = "0"; }, 300);

    // 3. po 1 sekunde zobraz nasledujúci obrazec a 4. sprístupni tlačidlo
    setTimeout(() => {
      if (!game) return;
      game.idx += 1;
      renderGame();
      game.busy = false;
    }, 1000);
  });

  /* ---------- výber úrovne ---------- */
  document.querySelectorAll(".level").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.dataset.level;
      if (progress[id] >= 20) {              // ZOPAKOVAŤ ÚROVEŇ = vynulovanie tejto úrovne
        progress[id] = 0;
        saveProgress();
      }
      startLevel(id);
    });
  });

  /* ---------- vynulovanie celého postupu ---------- */
  const overlay = $("overlay");
  $("btn-reset").addEventListener("click", () => { overlay.hidden = false; });
  $("dlg-cancel").addEventListener("click", () => { overlay.hidden = true; });
  $("dlg-ok").addEventListener("click", () => {
    progress = { easy: 0, medium: 0, hard: 0 };
    saveProgress();
    overlay.hidden = true;
    renderIntro();
  });

  /* ---------- celá obrazovka ---------- */
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }
  $("btn-fs").addEventListener("click", toggleFullscreen);
  $("intro-fs").addEventListener("click", toggleFullscreen);

  /* ---------- skrytá galéria na kontrolu všetkých obrazcov ---------- */
  function renderGallery(levelId) {
    const lv = LEVELS.find(l => l.id === levelId);
    $("gal-title").textContent = "Galéria · " + lv.label + " – " + lv.sk + " (20 obrazcov)";
    const grid = $("gal-grid");
    grid.innerHTML = "";
    for (const fig of FIGURES[levelId]) {
      const tile = document.createElement("div");
      tile.className = "gal-tile";
      const svg = makeSvg();
      drawFigure(svg, fig);
      tile.appendChild(svg);
      const gn = document.createElement("div");
      gn.className = "gn"; gn.textContent = fig.n;
      const gc = document.createElement("div");
      gc.className = "gc"; gc.textContent = fig.s.length + " paličiek";
      tile.appendChild(gn); tile.appendChild(gc);
      grid.appendChild(tile);
    }
    showScreen(scrGallery);
  }
  function route() {
    const h = location.hash || "";
    if (h.indexOf("#galeria-") === 0) {
      const id = h.slice(9);
      if (FIGURES[id]) { renderGallery(id); return; }
    }
    if (h === "#galeria") { renderGallery("easy"); return; }
    if (h.indexOf("#hra-") === 0) {
      const id = h.slice(5);
      if (FIGURES[id]) { startLevel(id); return; }
    }
    renderIntro();
  }
  window.addEventListener("hashchange", route);

  /* ---------- štart ---------- */
  route();
})();
</script>
</body>
</html>
